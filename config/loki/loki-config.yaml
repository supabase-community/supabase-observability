auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Overrides Loki's default 30m chunk_idle_period so logs are queryable
# within seconds rather than half an hour - appropriate for a
# single-node dev/self-hosted deployment, not a high-throughput cluster.
ingester:
  chunk_idle_period: 30s
  flush_check_period: 10s

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  retention_period: ${LOGS_RETENTION_PERIOD}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
