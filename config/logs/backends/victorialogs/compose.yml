# VictoriaLogs as the log store. docker-compose.o11y-logs.yml runs this
# as `logs-store` when BACKEND_LOGS=victorialogs.
services:
  logs-store:
    image: victoriametrics/victoria-logs:v1.51.0
    container_name: supabase-observability-victorialogs
    restart: unless-stopped
    ports:
      - "127.0.0.1:9428:9428"
    command:
      - "--storageDataPath=/victorialogs-data"
      - "--retentionPeriod=${LOGS_RETENTION_PERIOD:-30d}"
    volumes:
      - victorialogs_data:/victorialogs-data
    networks:
      default:
        aliases: [victorialogs]
