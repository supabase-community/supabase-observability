# Makes Supabase's metrics endpoints reachable from this project's
# collector. Applied to the Supabase stack, not this project's own
# compose file. Auth, imgproxy, and Storage's push are off by default;
# PostgREST's admin server listens on localhost.
#
# realtime and supavisor need nothing here - their metrics endpoints are
# on by default and only require a Bearer JWT, which the collector reads
# from the generated jwt file.
#
# The gateway is in overrides/metrics-envoy.yml: Envoy's admin listener
# also serves /config_dump (keys and JWTs in plaintext), so it's exposed
# with allow_paths rather than an env var.
#
# All of these require recreating the container: env vars only load at
# process start.
services:
  auth:
    environment:
      GOTRUE_METRICS_ENABLED: "true"
      # Default exporter is opentelemetry, not prometheus - must be set
      # explicitly. Serves on :9100 at path "/", not "/metrics".
      GOTRUE_METRICS_EXPORTER: "prometheus"

  rest:
    environment:
      # Supabase's compose sets the same port. It's set here too so it
      # always matches the scrape target in config/metrics/otel-collector.yaml.
      PGRST_ADMIN_SERVER_PORT: "3001"
      # Supabase's compose sets localhost, reachable only from inside the
      # container. 0.0.0.0 lets the collector reach it over supabase_default.
      PGRST_ADMIN_SERVER_HOST: "0.0.0.0"

  imgproxy:
    environment:
      IMGPROXY_PROMETHEUS_BIND: ":8081"

  storage:
    environment:
      OTEL_METRICS_ENABLED: "true"
      # Endpoint is our otel-collector's OTLP gRPC receiver, reachable
      # over supabase_default since otel-collector joins that network.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://supabase-observability-otel:4317"