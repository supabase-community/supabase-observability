# ============================================================
# Backend: VictoriaMetrics (bundled, default)
#
# Naming contract — these three are always the same word:
#   filename         victoriametrics.yaml
#   compose profile  profiles: ["victoriametrics"]
#   container host   http://victoriametrics:8428
#
# To add a new backend, copy this file into backends/otel-collector/,
# rename it, and keep that contract. `ls backends/otel-collector/`
# = supported backends.
# ============================================================

exporters:
  # VictoriaMetrics ingests via the Prometheus remote-write
  # protocol — same exporter works for Mimir, Thanos, AMP.
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write

service:
  pipelines:
    metrics:
      # receivers/processors are defined in base.yaml;
      # OTel merges multiple --config files into one.
      receivers: [prometheus, otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]