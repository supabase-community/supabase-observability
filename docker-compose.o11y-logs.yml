name: supabase-observability

services:

  vector:
    image: timberio/vector:0.56.0-debian
    container_name: supabase-observability-vector
    restart: unless-stopped
    volumes:
      - ./config/logs/vector.yaml:/etc/vector/base.yaml:ro
      # Vector sink for the chosen store: config/logs/backends/<BACKEND_LOGS>/vector-sink.yaml
      - ./config/logs/backends/${BACKEND_LOGS:-victorialogs}/vector-sink.yaml:/etc/vector/backend.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    command: ["--config", "/etc/vector/base.yaml", "--config", "/etc/vector/backend.yaml"]
    environment:
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:-http://loki:3100}
      VICTORIALOGS_ENDPOINT: ${VICTORIALOGS_ENDPOINT:-http://victorialogs:9428}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    networks:
      - default

  # The log store: config/logs/backends/<BACKEND_LOGS>/compose.yml. Changing
  # BACKEND_LOGS and running `up -d` replaces the running store.
  logs-store:
    extends:
      file: config/logs/backends/${BACKEND_LOGS:-victorialogs}/compose.yml
      service: logs-store

volumes:
  loki_data:
  victorialogs_data:
  vector_data:
